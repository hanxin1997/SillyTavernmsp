name: Build Android APK

on:
  # Allows the owner to start a build from the GitHub Actions page.
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - "scripts/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-extension.yml"
  pull_request:
    paths:
      - "app/**"
      - "scripts/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-extension.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Test and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # The repository intentionally has no generated Gradle wrapper binary.
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Validate launcher icon resources
        shell: pwsh
        run: ./scripts/Test-LauncherIcon.ps1

      - name: Run tests, lint, and build APK
        shell: bash
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Generate APK checksum
        shell: bash
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Upload installable APK
        uses: actions/upload-artifact@v7
        with:
          name: sillytavern-eink-debug-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostic reports when the build fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: sillytavern-eink-reports-${{ github.run_number }}
          path: |
            app/build/reports/**
            app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14
